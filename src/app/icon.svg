<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f1629"/>

  <!-- Pivot triangle -->
  <polygon points="16,22 12,28 20,28" fill="#5a6ea8"/>

  <!-- Seesaw arm (tilted left-heavy) -->
  <rect x="4" y="20" width="24" height="2.5" rx="1.25" fill="#5a6ea8" transform="rotate(-10, 16, 21.25)"/>

  <!-- Ball on left (green, heavy side down) -->
  <circle cx="8.5" cy="16.5" r="4.5" fill="#3DCB5C"/>
  <circle cx="7.2" cy="15.2" r="1.5" fill="#6fe88a" opacity="0.5"/>

  <!-- Ball on right (red, light side up) -->
  <circle cx="23" cy="19" r="3" fill="#E03A3A"/>
  <circle cx="22" cy="18" r="1" fill="#f07070" opacity="0.5"/>
</svg>
